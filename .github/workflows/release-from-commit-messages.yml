name: Release from commit messages

on:
  workflow_dispatch:
  # 每天 18:00 UTC = 次日 02:00 北京时间，自动出一条 nightly 版本
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write

# 防止定时与手动触发撞车抢同一个 tag
concurrency:
  group: nightly-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 计算今天的版本号：<version.json 的 version>-nightly.<北京日期>
  # 同一天已经发过就直接跳过，保证“每天只更一次”
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve nightly version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          name=$(python -c "import json,sys; d=json.load(open('version.json',encoding='utf-8')); n=(d.get('name') or '').strip(); sys.exit('version.json must contain name and version') if not n else print(n)")
          base=$(python -c "import json,sys; d=json.load(open('version.json',encoding='utf-8')); v=(d.get('version') or '').strip(); sys.exit('version.json must contain name and version') if not v else print(v)")
          date=$(TZ=Asia/Shanghai date +%Y%m%d)
          version="${base}-nightly.${date}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          echo "title=v${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${version}" > /dev/null; then
            echo "Tag ${version} already exists, today's nightly is done."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved name=${name} version=${version}"

  test:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml

  build:
    needs: [prepare, test]
    if: needs.prepare.outputs.release == 'true'
    env:
      name: ${{ needs.prepare.outputs.name }}
      version: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: 'pipenv'
      - name: Install dependencies with pipenv
        shell: bash
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv --python 3.14
          pipenv install --dev
      - name: Build the primary GUI application
        run: pipenv run ui_build
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "dist\$env:name-GUI-v$env:version"
          if (-not (Test-Path $bundle)) {
            Write-Error "Windows application directory not found: $bundle"
            exit 1
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $asset = "$env:name-GUI-Windows-$env:RUNNER_ARCH-v$env:version.zip"
          Compress-Archive -Path $bundle -DestinationPath (Join-Path $PWD "artifacts\$asset")
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="dist/${name}-GUI-v${version}.app"
          if [[ ! -d "$app_path" ]]; then
            echo "macOS application bundle not found: $app_path" >&2
            exit 1
          fi
          mkdir -p artifacts
          asset="${name}-GUI-macOS-${RUNNER_ARCH}-v${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "artifacts/$asset"
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}-${{ runner.arch }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      name: ${{ needs.prepare.outputs.name }}
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}
      release_title: ${{ needs.prepare.outputs.title }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: release-assets
          merge-multiple: true
      - name: Validate release tag does not already exist
        shell: pwsh
        run: |
          $existingTag = git tag --list $env:release_tag
          if ($existingTag) {
            Write-Error "Tag '$env:release_tag' already exists."
            exit 1
          }
      - name: Generate release notes from commit messages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # nightly 以上一个 tag（通常是昨天的 nightly）为基准，只列当天新增的提交
          $baseCommit = (git describe --tags --abbrev=0 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $baseCommit) {
            $baseCommit = (git rev-list --max-parents=0 HEAD | Select-Object -First 1)
          }
          $baseCommit = $baseCommit.Trim()
          $rawMessages = git log --reverse --format=%s "$baseCommit..HEAD"
          $skipPatterns = @(
            '^(?i)release:\s*v?\d',
            '^(?i)release\b',
            '^(?i)chore:\s*version\b',
            '^(?i)chore(?:\(.+\))?:\s*bump\s+version\b',
            '^(?i)bump\s+version\b',
            '^(?i)version\s+update\b',
            '^(?i)merge\s+pull\s+request\b',
            '^(?i)merge\b'
          )
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in $rawMessages) {
            $message = $line.Trim()
            if (-not $message) { continue }
            $skip = $false
            foreach ($pattern in $skipPatterns) {
              if ($message -match $pattern) {
                $skip = $true
                break
              }
            }
            if (-not $skip) {
              $notes.Add("- $message")
            }
          }
          if ($notes.Count -eq 0) {
            $notes.Add("Nightly build $env:release_title (no new commits since $baseCommit)")
          }
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "Release notes generated from base commit: $baseCommit"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem release-assets -Filter '*.zip' | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) {
            Write-Error "Expected two desktop assets, found $($assets.Count)."
            exit 1
          }
          $checksums = Join-Path $PWD 'release-assets/SHA256SUMS.txt'
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content -Path $checksums -Encoding utf8NoBOM
          $extra = @()
          if ($env:version -match '-nightly\.') { $extra = @('--prerelease') }
          gh release create $env:release_tag $assets $checksums --title $env:release_title --notes-file release-notes.md --target $env:GITHUB_SHA @extra
      - name: Confirm release
        shell: pwsh
        run: Write-Host "Released $env:version with Windows and macOS desktop assets."
